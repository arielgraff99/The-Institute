[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "institute-evidence-search"
version = "0.1.0"
description = "Reusable, auditable recursive evidence-search engine"
requires-python = ">=3.10"
dependencies = ["networkx>=3.2", "pydantic>=2.6"]

[project.optional-dependencies]
visual = ["pydot>=2.0"]
test = ["pytest>=8.0"]

[project.scripts]
institute-search = "institute_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
